# Common application settings
spring:
  application:
    name: ticketing_spring_sample
  profiles:
    active: dev  # Default profile (can be overridden with --spring.profiles.active)

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  docker:                     # in development (dev profile) --> docker:compose:enabled:false
    compose:                  # unless the database and settings will be prod profile database and settings
      enabled: false

  web:
    resources:
      static-locations: classpath:/static/

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

  messages:
    basename: messages/messages
    encoding: utf-8

  main:
    allow-bean-definition-overriding: true


  kafka:
    bootstrap-servers: 100.99.137.56:9092
    consumer:
      group-id: building-service-updater
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

kafka:
  topic:
    address-create-request: address-create-request-topic
    address-created: address-created-topic

outbox:
  publisher:
    delay: 2000

app:
  file:
    upload-dir: uploads                          # مسیر ذخیره فایل‌ها

# Management endpoints (Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus  # Expose useful endpoints

  endpoint:
    health:
      show-details: always

  health:
    redis:
      enabled: false


# Logging configuration
logging:
  level:
    root: INFO
    com.spring_jpa_cache: DEBUG
    org.springframework.security: INFO  # Debug Spring Security
    org.hibernate.SQL: OFF            # Show SQL queries
    org.hibernate.orm.jdbc.bind: OFF  # Show parameter binding
    org.hibernate.orm.jdbc.extract: OFF  # Show result extraction
    org.springframework.transaction: OFF  # Transaction management
    org.hibernate.engine.transaction: OFF  # Transaction details
    #    com.zaxxer.hikari: DEBUG           # HikariCP pool details
    #    com.zaxxer.hikari.pool: TRACE      # HikariCP pool more details
    org.springframework.jdbc: WARN    # JDBC operations
    org.springframework.cache: WARN
    org.springframework.mail: WARN
    ir.client.AddressClient: WARN
    net.javacrumbs.shedlock: WARN
    org.apache.kafka: WARN
    org.springframework.data.redis: WARN
    org.mongodb.driver: WARN
    com.mongodb: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"


  file:
    name: logs/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7



# Production profile (PostgreSQL)
---
spring:
  config:
    activate:
      on-profile: prod

  mail:
    host: smtp.zoho.com
    port: 587
    username: ticketing_spring_sample@zohomail.com
    password: ${ZOHO_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


  flyway:
    enabled: true
    locations: classpath:db/migration/postgres
    baseline-on-migrate: true


  datasource:
    url: jdbc:postgresql://postgres:5432/spring_db
    username: mft
    password: mft123
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20        # Max connections in pool
      connection-timeout: 30000    # 30 seconds timeout
      idle-timeout: 60000
      max-lifetime: 1800000
      initialization-fail-timeout: 0  # No fail on init
      leak-detection-threshold: 20000
  jpa:
    hibernate:
      ddl-auto: update           # Update schema in production
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50          # Batch size for performance
  data:
    mongodb:
      auto-index-creation: true
      uri: mongodb://mongodb:27017/spring_db_photos?maxPoolSize=100&minPoolSize=10&waitQueueTimeoutMS=10000&connectTimeoutMS=10000&socketTimeoutMS=60000
    redis:
      host: redis
      port: 6379
  cache:
    type: redis


address:
  service:
    url: ${ADDRESS_SERVICE_URL:http://100.99.137.56}

app:
  base-url: https://100.94.54.4:8443

  ocr:
    tessdata-path: /usr/share/tesseract-ocr/5/tessdata

server:
  port: 8443                     # HTTPS port
  ssl:
     enabled: true
     key-store: classpath:ticketingssl.jks
     key-store-password: mha123
     key-alias: ticketingkey
     key-store-type: JKS
  servlet:
      session:
        timeout: 15m               # Session timeout after 15 minutes
        cookie:
          http-only: true          # Prevent JS access to cookies
          secure: true             # Only over HTTPS
          same-site: strict        # Prevent CSRF via cross-site requests

  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 100
    connection-timeout: 20000

