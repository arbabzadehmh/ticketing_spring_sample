<div th:fragment="notifications-table">
    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h3 class="mb-0" th:text="#{notification.title}"></h3>
        </div>

        <div class="card-body">
            <!-- کنترل‌های صفحه‌بندی و مرتب‌سازی -->
            <div class="row mb-4 g-3">
                <div class="col-12 col-md-4">
                    <select class="form-select" id="pageSize" aria-label="تعداد در صفحه">
                        <option value="10" th:text="#{profiles.pageSize.10}"
                                th:selected="${param.size == 10}"></option>
                        <option value="20" th:text="#{profiles.pageSize.20}"
                                th:selected="${param.size == 20}"></option>
                    </select>
                </div>
            </div>

            <div class="table-responsive" id="notifications-table">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th th:text="#{notification.table.record.title}"></th>
                        <th th:text="#{notification.message}"></th>
                        <th th:text="#{notification.read}"></th>
                        <th th:text="#{notification.time}"></th>
                        <th th:text="#{notification.link}"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="notification : ${notifications.content}">
                        <td th:text="${notification.title}"></td>
                        <td th:text="${notification.message}"></td>
                        <td th:text="${notification.isRead}"></td>
                        <td th:text="${#temporals.format(notification.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                        <td>
                            <div class="d-flex gap-2">
                                <button class="btn btn-sm btn-info btn-open"
                                        th:data-id="${notification.id}"
                                        th:data-link="${notification.link}">
                                    <i class="fas fa-newspaper"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- صفحه‌بندی -->
            <nav class="mt-4" aria-label="صفحه‌بندی">
                <ul class="pagination justify-content-center">
                    <li th:each="page : ${#numbers.sequence(0, (totalPages - 1))}"
                        class="page-item"
                        th:classappend="${page == notifications.number} ? 'active'">
                        <a class="page-link"
                           th:text="${page + 1}"
                           th:data-page="${page}"
                           role="button"></a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
