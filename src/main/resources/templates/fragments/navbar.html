<nav th:fragment="navbar" class="navbar navbar-dark bg-primary border-bottom py-2"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="container-fluid">
        <!-- سمت چپ: دکمه همبرگر و لوگو -->
        <div class="d-flex align-items-center">
            <button id="sidebarToggleBtn" class="btn btn-link text-white">
                <i class="fas fa-bars fs-4"></i>
            </button>
            <h5 class="mb-0 text-white ms-2" th:text="#{dashboard.title}"></h5>
        </div>

        <!-- سمت راست: آیکون‌ها -->
        <div class="d-flex align-items-center gap-3">


            <div class="d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                <!-- اعلان‌ها -->
                <div class="dropdown">
                    <button class="btn btn-link text-white position-relative" data-bs-toggle="dropdown">
                        <i class="fas fa-bell"></i>

                        <span th:if="${notificationCount > 0}"
                              class="notification-badge position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                              th:text="${notificationCount}">
                        </span>

                    </button>

                    <ul class="dropdown-menu dropdown-menu-end">
                        <li th:if="${#lists.isEmpty(notifications)}">
                            <span class="dropdown-item text-muted" th:text="#{navbar.no.notification}"></span>
                        </li>

                        <li th:each="n : ${notifications}">
                            <a class="dropdown-item small notification-item"
                               th:href="${n.link != null ? n.link : '#'}"
                               th:data-id="${n.id}"
                               th:classappend="${!n.read} ? 'fw-bold'">
                                <strong th:text="${n.title}"></strong><br>
                                <span th:text="${n.message}"></span>
                            </a>
                        </li>

                        <li>
                            <hr class="dropdown-divider">
                        </li>

                        <li>
                            <a class="dropdown-item text-center" href="/notifications"
                               th:text="#{navbar.all.notification}"></a>
                        </li>
                    </ul>

                </div>

                <!-- پیام‌ها -->
                <div class="dropdown">
                    <a class="btn btn-link text-white position-relative" href="/tickets">
                        <i class="fas fa-envelope"></i>

                        <span th:if="${messageCount > 0}"
                              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                              th:text="${messageCount}">
                        </span>
                    </a>
                </div>


                <!-- پروفایل -->
                <div class="dropdown">
                    <button class="btn btn-link text-white" data-bs-toggle="dropdown">
                        <i class="fas fa-user-circle fs-4"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/setting">
                            <i class="fas fa-cog me-2"></i>
                            <span th:text="#{navbar.settings}"></span>
                        </a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item">
                                    <i class="fas fa-sign-out-alt me-2"></i>
                                    <span th:text="#{navbar.logout}"></span>
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="dropdown" sec:authorize="!isAuthenticated()">

                <button class="btn btn-link text-white" data-bs-toggle="dropdown">
                    <i class="fas fa-sign-in"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="/login" th:text="#{login}"></a></li>
                </ul>

            </div>

            <!-- تغییر زبان -->
            <div class="btn-group">
                <div class="btn-group">
                    <select id="languageSwitcher" class="form-select form-select-sm">
                        <option value="en" th:selected="${#locale.language == 'en'}">English</option>
                        <option value="fa" th:selected="${#locale.language == 'fa'}">فارسی</option>
                    </select>
                </div>

            </div>

            <!-- تغییر تم -->
            <div class="form-check form-switch">
                <input class="form-check-input"
                       type="checkbox"
                       role="switch"
                       id="themeSwitch">
                <label class="form-check-label text-white" for="themeSwitch">
                    <i id="themeIcon" class="fas fa-moon"></i>
                </label>
            </div>
        </div>
    </div>
</nav>
