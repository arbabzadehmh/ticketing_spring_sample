<div th:fragment="messages-chatbox" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="card shadow">
        <div class="card-header bg-primary text-white p-3">
            <div class="d-flex flex-column">
                <h3 class="mb-4" th:text="#{messages.title}"></h3>
                <h5 class="mb-0" th:text="${#messages.msg('tickets.title')} + ' : ' + ${ticket.title}"></h5>
            </div>
        </div>

        <div class="card-body">
            <!-- جایی که پیام‌ها نمایش داده می‌شود -->
            <div id="chat-box" class="chat-box">
                <div th:each="message : ${messages}"
                     class="message"
                     th:classappend="${message.senderRoleName == 'ROLE_ADMIN' ? 'msg-admin'
                            : (message.senderRoleName == 'ROLE_MANAGER' ? 'msg-manager' : 'msg-customer')}">
                    <h6 class="ltr small-text" th:text="${message.senderUsername} + ':' "></h6>
                    <p th:text="${message.content}"></p>

                    <!-- نمایش اولین OCR اگر وجود داشته باشد -->
                    <div th:if="${message.attachments != null
                           and #lists.size(message.attachments) > 0
                           and message.attachments.get(0).extractedText != null}">
                        <div class="alert alert-info mt-2 p-2 small">
                            <strong id="ocrExtractedTextLabel" th:text="#{messages.extractedText}"></strong>
                            <span th:text="${message.attachments.get(0).extractedText}"></span>
                        </div>
                    </div>

                    <!-- فایل‌ها -->
                    <div class="attachments mt-2" th:if="${message.attachments != null}">
                        <div th:each="file : ${message.attachments}">

                            <!-- اگر عکس -->
                            <a th:if="${file.fileType.name() == 'JPG' or file.fileType.name() == 'PNG' or file.fileType.name() == 'BMP'}"
                               th:href="@{'/rest/images/' + ${file.mongoFileId} + '/raw'}" target="_blank">
                                <img th:src="@{'/rest/images/' + ${file.mongoFileId} + '/raw'}" class="chat-thumb"/>
                            </a>

                            <!-- PDF -->
                            <a th:if="${file.fileType.name() == 'PDF'}"
                               th:href="@{'/rest/images/' + ${file.mongoFileId} + '/download'}" target="_blank"
                               class="d-block">
                                <i class="fas fa-file-pdf fa-2x text-danger"></i>
                                <small th:text="${file.fileName}"></small>
                            </a>

                            <!-- سایر فایل‌ها -->
                            <a th:if="${file.fileType.name() != 'PDF'
                        and file.fileType.name() != 'JPG'
                        and file.fileType.name() != 'PNG'
                        and file.fileType.name() != 'BMP'}"
                               th:href="@{'/rest/images/' + ${file.mongoFileId} + '/download'}" target="_blank">
                                <i class="fas fa-file fa-2x"></i>
                                <small th:text="${file.fileName}"></small>
                            </a>

                        </div>
                    </div>

                    <small class="text-muted ltr small-text"
                           th:text="${#temporals.format(message.dateTime, 'yyyy-MM-dd HH:mm')}"></small>
                </div>
            </div>

            <!-- فرم ارسال پیام -->
            <form id="messageForm" class="d-flex align-items-center gap-2 mt-auto">
                <input type="hidden" id="ticketId" name="ticketId" th:value="${ticketId}"/>

                <input type="text" class="form-control" id="messageContent" name="content"
                       th:placeholder="#{messages.new}"/>

                <input type="file" id="messageFile" name="files" class="form-control-file d-none"/>
                <label for="messageFile" class="btn btn-outline-secondary mb-0">
                    <i class="fas fa-paperclip"></i>
                </label>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i>
                </button>

                <button type="button" id="ocrSendBtn" class="btn btn-warning" th:text="#{messages.ocr}">
                    <i class="fas fa-image"></i>
                </button>
                <input type="file" id="ocrFile" class="d-none">

                <div class="mb-3" sec:authorize="hasRole('CUSTOMER')">

                    <button type="button" id="ticketCloseBtn" class="btn btn-dark mb-1 col-md-9"
                            th:text="#{messages.close}">
                        <i class="fas fa-close"></i>
                    </button>

                    <button class="btn btn-info mb-1 col-md-9" data-bs-toggle="dropdown" th:text="#{messages.score}" th:disabled="${ticket.score != null}">
                        <i class="fas fa-gift"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><button class="dropdown-item btn-score" data-score="5" th:text="#{messages.score.5}"></button></li>
                        <li><button class="dropdown-item btn-score" data-score="4" th:text="#{messages.score.4}"></button></li>
                        <li><button class="dropdown-item btn-score" data-score="3" th:text="#{messages.score.3}"></button></li>
                        <li><button class="dropdown-item btn-score" data-score="2" th:text="#{messages.score.2}"></button></li>
                        <li><button class="dropdown-item btn-score" data-score="1" th:text="#{messages.score.1}"></button></li>
                    </ul>


                </div>

            </form>


        </div>
    </div>
</div>
