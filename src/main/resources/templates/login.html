<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="en"
      dir="ltr"
      th:attr="lang=${#locale.language}, dir=${#locale.language == 'fa' ? 'rtl' : 'ltr'}">
<head>
    <meta charset="UTF-8">

    <title th:text="#{login.title}"></title>
    <th:block th:replace="~{fragments/head-tags :: head-tags}"></th:block>
</head>
<body>

<main class="p-5 justify-content-center">
    <div class="container-fluid p-5 justify-content-center bg-secondary-subtle">

        <div class="bg-secondary p-3">

            <form action="/login" method="post" class="col-md-4 ms-auto me-3">
                <div>

                    <div class="mb-3">
                        <label for="username" class="form-label" th:text="#{users.username}"></label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>

                    <div class="mb-5">
                        <label for="password" class="form-label" th:text="#{users.password}"></label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>

                    <div class="row mb-3 g-2">
                        <div class="col-6">
                            <button type="button" class="btn btn-light w-100"
                                    data-bs-toggle="modal"
                                    data-bs-target="#profileRegisterModal">
                                <span th:text="#{signup}"></span>
                            </button>
                        </div>

                        <div class="col-6">
                            <a class="btn btn-light w-100" href="/resetPass">
                                <span th:text="#{forget.password}"></span>
                            </a>
                        </div>
                    </div>


                    <div class="row mb-3 g-2">
                        <div class="col-6">
                            <input type="submit"
                                   class="btn btn-primary w-100"
                                   th:value="#{login}">
                        </div>

                        <div class="col-6">
                            <a class="btn btn-primary w-100" href="/home">
                                <span th:text="#{guest.login}"></span>
                            </a>
                        </div>
                    </div>


                    <div th:if="${param.error}">
                        <h6 th:text="#{login.error}"></h6>
                    </div>

                </div>

            </form>

        </div>

    </div>
</main>

<div th:replace="~{fragments/profile-fragments/profile-register-modal :: profile-register-modal}"></div>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

<script th:src="@{/js/profiles-register.js}"></script>

</body>
</html>
